[project]
name = "slime-roads-ro"
version = "0.1.0"
description = "Physarum simulation on Romania's terrain, tuned by a genetic algorithm and compared with the real road network."
readme = "README.md"
requires-python = ">=3.12,<3.14"
# Core: everything the simulation, graph extraction, metrics and GA need. This is all the cluster installs.
dependencies = [
    "numpy>=2.0",
    "numba>=0.60",
    "scipy>=1.13",
    "networkx>=3.3",
    "scikit-image>=0.24",
    "pyyaml>=6.0",
]

[dependency-groups]
# Local only: download and preprocess geodata into data/processed/.
geo = [
    "rasterio>=1.4",
    "pyrosm>=0.6.2",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
]
viz = [
    "matplotlib>=3.9",
    "pygame>=2.6",
    "imageio>=2.34",
]
dev = [
    "pytest>=8.0",
]

[tool.uv]
default-groups = ["geo", "viz", "dev"]
# The repo lives in OneDrive: copy files into .venv instead of hardlinking them from the uv cache.
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
